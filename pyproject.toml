[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "retrievalci"
version = "0.2.0"
description = "Evidence-aware regression checks for retrieval systems"
requires-python = ">=3.10"
readme = {file = "README_PYPI.md", content-type = "text/markdown"}
license = "MIT"
license-files = ["LICENSE"]
dependencies = []
keywords = ["rag", "retrieval", "evaluation", "testing", "ci"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/Balaji91221/retrievalci"
Documentation = "https://github.com/Balaji91221/retrievalci/blob/main/docs/usage.md"
Repository = "https://github.com/Balaji91221/retrievalci"
Issues = "https://github.com/Balaji91221/retrievalci/issues"
Changelog = "https://github.com/Balaji91221/retrievalci/blob/main/CHANGELOG.md"

[project.scripts]
retrievalci = "retrievalci.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
