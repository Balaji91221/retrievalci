name: test-and-package
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build
      - run: python -m build
      - name: Install built wheel
        run: python -c "import glob,subprocess,sys; subprocess.check_call([sys.executable,'-m','pip','install','--no-deps',glob.glob('dist/*.whl')[0]])"
      - run: python -m unittest discover -s tests -v
      - run: python examples/demo.py --output demo-output
      - run: retrievalci --help
      - uses: actions/upload-artifact@v4
        with:
          name: retrievalci-${{ matrix.os }}-${{ matrix.python }}
          path: |
            dist/
            demo-output/*.json
            demo-output/*.html
